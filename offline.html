<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline | MIFASARW</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<style>
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f4f4f6;color:#1a1a1f}
@media(prefers-color-scheme:dark){body{background:#15151a;color:#eee}.it,.box{background:#202027!important}}
main{max-width:720px;margin:0 auto;padding:18px}h1{font-size:1.3rem}h2{font-size:1.05rem;margin:22px 0 4px}p.s{color:#777;margin:.3em 0}
.it{display:flex;gap:12px;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001;margin:10px 0;overflow:hidden;align-items:center}
.it a{display:flex;gap:12px;flex:1;color:inherit;text-decoration:none;align-items:center}
.it img{width:96px;height:72px;object-fit:cover;background:#ddd;flex:none}.it b{display:block;padding:8px 0;line-height:1.3}
.it small{display:block;color:#2a9d5b;font-weight:600}
.it button{border:0;background:none;font-size:1.2rem;padding:12px;cursor:pointer}
.box{background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001;padding:14px;margin:10px 0}
.home,.btn{display:inline-block;background:#e63946;color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:600;border:0;cursor:pointer;font-size:.95rem;margin:4px 6px 0 0}
.btn.d{background:#444}
.bar{height:8px;border-radius:6px;background:#8883;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:#2a9d5b}
</style>
</head>
<body>
<main>
<h1 id="h">📚 Inkuru zibitswe offline</h1>
<p class="s" id="s">Izi nkuru zirasomeka nta internet.</p>
<div id="list"></div>
<p id="empty" style="display:none" class="s">Nta nkuru urabika. Fungura inkuru, ukande “💾 Bika offline”.</p>

<h2 id="rh">🕘 Zasomwe vuba</h2>
<p class="s" id="rs">📴 = isomeka nta internet.</p>
<div id="recent"></div>

<h2 id="sh">💽 Umwanya</h2>
<div class="box">
  <div id="st" class="s">…</div>
  <div class="bar"><i id="stb"></i></div>
  <button class="btn d" id="clr">🧹 Siba cache y’agateganyo</button>
  <button class="btn d" id="clrAll">🗑️ Siba inkuru zose zibitswe</button>
</div>

<a class="home" id="home" href="/">Ahabanza</a>
<a class="home" style="background:#2a9d5b" id="ins" href="/install.html">📲 Shyira app</a>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var lang="rw"; try{var q=new URLSearchParams(location.search).get("lang");lang=q==="en"||q==="rw"?q:(localStorage.getItem("siteLang")==="en"?"en":"rw");}catch(e){}
  var en=lang==="en";
  if(en){document.documentElement.lang="en";$("h").textContent="📚 Stories saved offline";$("s").textContent="These stories open without internet.";$("empty").textContent="Nothing saved yet. Open a story and tap “💾 Save offline”.";$("home").textContent="Home";$("ins").textContent="📲 Install app";
    $("rh").textContent="🕘 Recently read";$("rs").textContent="📴 = opens without internet.";$("sh").textContent="💽 Storage";$("clr").textContent="🧹 Clear temporary cache";$("clrAll").textContent="🗑️ Delete all saved stories";}
  var a=[],rec=[];
  try{a=JSON.parse(localStorage.getItem("mifasaSaved")||"[]")}catch(e){}
  try{rec=JSON.parse(localStorage.getItem("mifasaRecent")||"[]")}catch(e){}

  function item(x,withDel){
    var d=document.createElement("div");d.className="it";
    var l=document.createElement("a");l.href=x.url||("/story.html?news="+encodeURIComponent(x.id));
    if(x.img){var i=document.createElement("img");i.src=x.img;i.alt="";i.referrerPolicy="no-referrer";l.appendChild(i);}
    var b=document.createElement("b");b.textContent=x.title||x.id;l.appendChild(b);
    var sm=document.createElement("small");b.appendChild(sm);
    try{caches.match(x.url||"").then(function(h){ if(h) sm.textContent="📴"; });}catch(e){}
    d.appendChild(l);
    if(withDel){
      var r=document.createElement("button");r.textContent="🗑️";r.title="Remove";
      r.onclick=function(){a=a.filter(function(y){return y.id!==x.id});try{localStorage.setItem("mifasaSaved",JSON.stringify(a))}catch(e){}
        try{caches.open("mifasarw-saved").then(function(c){c.delete(location.origin+(x.url||""))})}catch(e){} draw();};
      d.appendChild(r);
    }
    return d;
  }
  function draw(){
    $("list").innerHTML="";$("empty").style.display=a.length?"none":"block";
    a.forEach(function(x){$("list").appendChild(item(x,true));});
    $("recent").innerHTML="";
    var ids={};a.forEach(function(x){ids[x.id]=1});
    rec.filter(function(x){return !ids[x.id]}).slice(0,15).forEach(function(x){$("recent").appendChild(item(x,false));});
  }
  draw();

  function mb(n){return (n/1048576).toFixed(1)+" MB"}
  function storage(){
    if(!(navigator.storage&&navigator.storage.estimate)){$("st").textContent="—";return;}
    navigator.storage.estimate().then(function(e){
      $("st").textContent=(en?"Used: ":"Bikoresha: ")+mb(e.usage||0)+(e.quota?(en?" of ":" kuri ")+mb(e.quota):"");
      $("stb").style.width=Math.min(100,((e.usage||0)/(e.quota||1))*100)+"%";
    });
  }
  storage();
  $("clr").onclick=function(){
    caches.keys().then(function(ns){return Promise.all(ns.filter(function(n){return /^mifasarw-(runtime|images)/.test(n)}).map(function(n){return caches.delete(n)}))}).then(function(){storage();draw();});
  };
  $("clrAll").onclick=function(){
    if(!confirm(en?"Delete all saved stories?":"Gusiba inkuru zose zibitswe?"))return;
    a=[];try{localStorage.setItem("mifasaSaved","[]")}catch(e){}
    caches.delete("mifasarw-saved").then(function(){storage();draw();});
  };
})();
</script>
<script src="/mifasa-app.js" defer></script>
<script src="/mifasa-plus.js" defer></script>
<script src="/mifasa-offline.js" defer></script>
</body>
</html>
