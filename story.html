   Kinyarwanda (rw/kin) cyangwa ari muri Kigali (isaha Africa/Kigali) -> rw, ibindi byose -> en. Icyo yahisemo ubwe gihora imbere. */
function mifasaDetectLang() {
  try {
    var saved = localStorage.getItem("siteLang");
    if (saved === "en" || saved === "rw") return saved;
  } catch (e) {}
  try {
    var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]).map(function (l) { return String(l).toLowerCase(); });
    if (langs.some(function (l) { return /^(rw|kin)(-|$)/.test(l); })) return "rw";
    var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (tz === "Africa/Kigali") return "rw";
    return "en";
  } catch (e) { return "rw"; }
}
let currentLang = mifasaDetectLang();
let relatedItems = [];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ID ya visitor: ni yo ibika ibara, umwijima n'ururimi ku mapaji yose y'urubuga */
function visitorId() {
    let v = "";
    try {
        v = localStorage.getItem("mifasa_visitor_id") || "";
        if (!v) {
            const raw = window.screen.width + navigator.language + navigator.userAgent;
            let h = 5381;
            for (let i = 0; i < raw.length; i++) h = ((h << 5) + h + raw.charCodeAt(i)) >>> 0;
            v = "MFS-" + h.toString(16).toUpperCase().padStart(8, "0");
            localStorage.setItem("mifasa_visitor_id", v);
        }
    } catch (e) {}
    return v;
}
const VID = visitorId();
const getPref = k => { try { return localStorage.getItem(k + "_" + VID); } catch (e) { return null; } };
const setPref = (k, v) => { try { localStorage.setItem(k + "_" + VID, v); } catch (e) {} };

/* DOSIYE ZOSE Z'URUBUGA (ai.json ntirimo: ni ubwenge bwa MIFASA AI, si inkuru) */
const MIFASA_JSON_FILES = [

/* Helper Functions */
function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    const val = params.get(name);
    return val ? val.trim() : null;   // URLSearchParams already decodes; decoding twice broke ids with %
}

function safeText(val, fallback = "") {
    return (val !== null && val !== undefined) ? String(val) : fallback;
}

function normalizeUrl(url) {
    if (!url) return DEFAULT_IMAGE;
    const str = String(url).trim();
    if (str.startsWith("http://") || str.startsWith("https://") || str.startsWith("data:")) return str;
    return `${SITE_URL}/${str.replace(/^\/+/, "")}`;
}

/* Ni yo mikorere ya script.js ikora "slug" y'umutwe: ikoreshwa iyo inkuru idafite id */
function generateSlug(text) {
    return String(text)
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
}

/* Match ID intelligently across formats (ubu hari n'slug y'umutwe) */
function matchId(item, targetId) {
    if (!item || typeof item !== "object") return false;
    const target = String(targetId).trim().toLowerCase();

    const possibleIds = [
        item.share_id,
        item.id,
        item.news_id,
        item.slug
    ].filter(v => v !== null && v !== undefined).map(v => String(v).trim().toLowerCase());

    if (possibleIds.includes(target)) return true;

    const t = item.title_rw || item.title_en || item.title;
    return typeof t === "string" && t.trim() !== "" && generateSlug(t) === target;
}

/* Extract item recursively */
function findStoryInData(obj, targetId, depth = 0) {
    if (!obj || depth > 14) return null;

    if (Array.isArray(obj)) {
        for (const item of obj) {
            const found = findStoryInData(item, targetId, depth + 1);
            if (found) return found;
        }
    } else if (typeof obj === "object") {
        if (matchId(obj, targetId)) return obj;

        for (const key in obj) {
            if (obj[key] && typeof obj[key] === "object") {
                const found = findStoryInData(obj[key], targetId, depth + 1);
                if (found) return found;
            }
        }
    }
    return null;
}

async function fetchJSON(file) {
    try {
        const res = await fetch(file, { cache: "no-cache" });
        if (!res.ok) return null;
        return await res.json();
    } catch (e) {
        return null;
    }
}

/* Kopi MIFASA AI yabitse ku gikoresho (IndexedDB): inkuru igaragara ako kanya, nta kuvugana na server.
   Ikoreshwa gusa iyo kopi itarengeje amasaha 6; ubundi dusubira kuri server. */
function findInCache(id) {
    return new Promise(resolve => {
        try {
            if (typeof indexedDB === "undefined") return resolve(null);
            const req = indexedDB.open("mifasa_cache_v5", 1);
            req.onupgradeneeded = () => req.result.createObjectStore("files");   // nk'uko script.js ibikora
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
            req.onsuccess = () => {
                const db = req.result;
                const done = v => { try { db.close(); } catch (e) {} resolve(v); };
                try {
                    const cur = db.transaction("files", "readonly").objectStore("files").openCursor();
                    const MAX_AGE = 6 * 60 * 60 * 1000;
                    cur.onsuccess = e => {
                        const c = e.target.result;
                        if (!c) return done(null);
                        const rec = c.value;
                        if (!isBrainFile(c.key) && rec && rec.data && Date.now() - (rec.time || 0) < MAX_AGE) {
                            const s = findStoryInData(rec.data, id);
                            if (s) return done(s);
                        }
                        c.continue();
                    };
                    cur.onerror = () => done(null);
                } catch (e) { done(null); }
            };
        } catch (e) { resolve(null); }
    });
}

/* Discover files dynamically from manifests */
async function discoverManifestFiles() {
    const lists = await Promise.all(MANIFEST_FILES.map(m => fetchJSON(m)));
    const extra = [];
    lists.forEach(data => {
        if (!data) return;
        const list = Array.isArray(data) ? data : (data.json_files || data.files || []);
        if (Array.isArray(list)) {
            list.forEach(f => { if (typeof f === "string" && f.endsWith(".json")) extra.push(f); });
        }
    });
    return extra;
}

/* Gushakira mu madosiye 6 icyarimwe (aho kuyasoma imwe ku yindi) */
async function findInFiles(files, id) {
    let found = null, next = 0;
    const worker = async () => {
        while (!found && next < files.length) {
            const file = files[next++];
            const data = await fetchJSON(file);
            if (!found) {
                const s = findStoryInData(data, id);
                if (s) { found = s; console.log(`✓ Story found in: ${file}`); }
            }
        }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    return found;
}

/* Ububiko buhoraho news-archive/YYYY-MM-DD.json (+ index.json) */
async function findInArchive(id) {
    try {
        const m = /^mn(\d{4})(\d{2})_/i.exec(String(id));
        const idx = await fetchJSON("news-archive/index.json");
        const days = new Set();
        const walk = (o, d) => {
            if (!o || d > 6) return;
            if (typeof o === "string") { const k = /(\d{4}-\d{2}-\d{2})/.exec(o); if (k) days.add(k[1]); }
            else if (Array.isArray(o)) o.forEach(x => walk(x, d + 1));
            else if (typeof o === "object") for (const key in o) { walk(key, d + 1); walk(o[key], d + 1); }
        };
        walk(idx, 0);
        let list = [...days].sort().reverse();
        if (m) { const ym = `${m[1]}-${m[2]}`; list = list.filter(x => x.startsWith(ym)); }
        const files = list.slice(0, 45).map(x => `news-archive/${x}.json`);
        return files.length ? await findInFiles(files, id) : null;
    } catch (e) { return null; }
}

/* Main Story Loader */
async function loadStory() {
    const id = getQueryParam("news") || getQueryParam("id");
    const cat = getQueryParam("cat");
    const lang = getQueryParam("lang");

    if (lang && uiLabels[lang]) {
        currentLang = lang;
        localStorage.setItem("siteLang", currentLang);
        const sel = $("langSelect");
        if (sel) sel.value = currentLang;
    }

    if (!id) {
        showError(uiLabels[currentLang].notFound);
        return;
    }

    // 0. Kopi iri ku gikoresho: ako kanya
    let story = await findInCache(id);

    // 1. Try Category File directly if specified
    if (!story && cat && !isBrainFile(cat)) {
        const catFile = cat.endsWith(".json") ? cat : `${cat}.json`;
        const catData = await fetchJSON(catFile);
        story = findStoryInData(catData, id);
    }

    // 2. If not found, scan ALL Registered JSONs in MIFASA Engine
    if (!story) {
        const manifestDiscovered = await discoverManifestFiles();
        const allFilesToSearch = [...new Set([
            ...MIFASA_JSON_FILES,
            ...manifestDiscovered
        ])].filter(f => !isBrainFile(f));

        story = await findInFiles(allFilesToSearch, id);
    }

    // 3. Inkuru ya kera (irengeje iminsi 60): shakira mu bubiko buhoraho news-archive/ (share_id "MN202611_..." ivuga ukwezi)
    if (!story) story = await findInArchive(id);

    if (story) {
        currentStory = story;
        updateUI();
        loadRelated();
    } else {
        showError(uiLabels[currentLang].notFound);
    }
}

/* Render Data to DOM */
function updateUI() {
    if (!currentStory) return;

    document.documentElement.lang = currentLang;
    const labels = uiLabels[currentLang];

    $("headerTitle").textContent = labels.header;
    $("labelPublished").textContent = labels.published;
    $("copyLinkButton").textContent = `🔗 ${labels.copy}`;
    if (!(window.speechSynthesis && window.speechSynthesis.speaking)) {
        $("audioButton").textContent = `🔊 ${labels.listen}`;
    }

    const title = safeText(
        currentStory[`title_${currentLang}`],
        safeText(currentStory.title_rw || currentStory.title || currentStory.name, "MIFASARW")
    );

    const summary = safeText(
        currentStory[`summary_${currentLang}`],
        safeText(currentStory.summary_rw || currentStory.summary || currentStory.desc, "")
    );

    const content = safeText(
        currentStory[`full_content_${currentLang}`],
        safeText(
            currentStory[`content_${currentLang}`],
            safeText(currentStory.full_content_rw || currentStory.content, summary)
        )
    );

    const image = normalizeUrl(currentStory.image || currentStory.thumbnail || currentStory.featured_image);

    $("storyTitle").textContent = title;
    $("storySummary").textContent = summary;
    $("fullContent").textContent = content;

    const imgEl = $("storyImage");
    imgEl.src = image;
    imgEl.onerror = function() { if (this.src !== DEFAULT_IMAGE) this.src = DEFAULT_IMAGE; };

    // Inkuru ni video (YouTube)? Erekana player muri story, ukande ▶ cyangwa "Reba" ikinikira aho
    const vidId = (function (s) {
        const ok = /^[\w-]{11}$/;
        if (s.video && ok.test(String(s.video.id || ""))) return s.video.id;
        const m = /(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/.exec(String(s.link || s.url || ""));
        return m ? m[1] : "";
    })(currentStory);
    const vBox = $("storyVideo"), watchBtn = $("watchButton");
    if (vidId && vBox) {
        const playVideo = () => {
            vBox.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vidId}?autoplay=1&rel=0&playsinline=1" title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;display:block;background:#000;"></iframe>`;
            vBox.style.cursor = "default";
            vBox.scrollIntoView({ behavior: "smooth", block: "center" });
        };
        const thumb = image && image !== DEFAULT_IMAGE ? image : `https://i.ytimg.com/vi/${vidId}/hqdefault.jpg`;
        vBox.innerHTML = `<div role="button" tabindex="0" aria-label="Play video" style="position:relative;cursor:pointer;"><img src="${esc(thumb)}" alt="" referrerpolicy="no-referrer" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;" onerror="this.src='https://i.ytimg.com/vi/${vidId}/hqdefault.jpg'"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff;text-shadow:0 2px 14px #000b;pointer-events:none;">▶</span></div>`;
        const trig = vBox.firstElementChild;
        trig.onclick = playVideo;
        trig.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playVideo(); } };
        vBox.style.display = "block"; vBox.style.margin = "0 0 14px";
        imgEl.style.display = "none";
        if (watchBtn) { watchBtn.textContent = labels.watch; watchBtn.style.display = ""; watchBtn.onclick = playVideo; }
    } else {
        if (vBox) vBox.style.display = "none";
        imgEl.style.display = "";
        if (watchBtn) watchBtn.style.display = "none";
    }

    $("storyBadge").textContent = safeText(
        currentStory.category || currentStory.cat || currentStory.source || "MIFASA"
    ).toUpperCase();

    const dateEl = $("storyDate");
    const pubDate = currentStory.publish || currentStory.date || currentStory.created_at;
    let isoDate;
    if (pubDate) {
        const d = new Date(pubDate);
        if (!isNaN(d.getTime())) {
            dateEl.textContent = d.toLocaleString(currentLang === "en" ? "en-US" : "rw-RW");
            isoDate = d.toISOString();
        } else {
            dateEl.textContent = pubDate;
        }
    } else {
        dateEl.textContent = "";
    }

    // Share & Metadata
    const idParam = getQueryParam("news") || getQueryParam("id") || "";
    // Canonical = paji ihamye s/<share_id>.html (iyo make-story-pages.js ikora). Iyo itabonetse, bikoresha story.html?news=ID
    const sid = String(currentStory.share_id || idParam || "");
    const validSid = /^[A-Za-z0-9_.-]{3,120}$/.test(sid) && sid[0] !== ".";
    const readerUrl = `${SITE_URL}/story.html?news=${encodeURIComponent(idParam || sid)}`;
    const staticUrl = validSid ? `${SITE_URL}/s/${encodeURIComponent(sid)}.html` : "";
    let canonical = staticUrl || readerUrl;
    if (staticUrl) {   // niba paji ya s/ itarakorwa (backlog), ntukerekeze Google ku 404
        fetch(staticUrl, { method: "HEAD", cache: "no-store" }).then(r => {
            if (!r.ok) { $("canonicalUrl").href = readerUrl; $("ogUrl").content = readerUrl; if (window.__renderShare) window.__renderShare(readerUrl.split("#")[0]); }
        }).catch(() => {});
    }

    document.title = `${title} | MIFASARW`;
    $("metaDescription").content = summary;
    $("canonicalUrl").href = canonical;
    $("ogTitle").content = title;
    $("ogDescription").content = summary;
    $("ogImage").content = image;
    $("ogUrl").content = canonical;
    $("ogLocale").content = currentLang === "en" ? "en_US" : "rw_RW";
    $("twTitle").content = title;
    $("twDescription").content = summary;
    $("twImage").content = image;

    // Meta tags zisigaye z'inkuru (zihabwa bwa mbere cyangwa zivugururwa): alt, itariki, icyiciro, ijambo-shakisha
    const setMeta = (key, value, attr) => {
        attr = attr || "property";
        let el = document.head.querySelector(`meta[${attr}="${key}"]`);
        if (!value) { if (el) el.remove(); return; }
        if (!el) { el = document.createElement("meta"); el.setAttribute(attr, key); document.head.appendChild(el); }
        el.setAttribute("content", value);
    };
    const kwRaw = currentStory.seo_keywords || currentStory.keywords;
    setMeta("keywords", Array.isArray(kwRaw) ? kwRaw.join(", ") : safeText(kwRaw, ""), "name");
    setMeta("og:image:alt", title);
    setMeta("twitter:image:alt", title, "name");
    setMeta("article:published_time", isoDate || "");
    setMeta("article:section", safeText(currentStory.category || currentStory.cat, ""));
    setMeta("og:type", "article");

    // Structured data nyayo y'iyi nkuru (kuri Google no kuri za mashini zishakisha)
    $("articleSchema").textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "headline": title.slice(0, 110),
        "description": summary,
        "image": [image],
        "datePublished": isoDate,
        "dateModified": isoDate,
        "inLanguage": currentLang,
        "mainEntityOfPage": canonical,
        "author": { "@type": "Person", "name": "MIFASA Mizero Fabrice Samuel" },
        "publisher": { "@type": "Organization", "name": "MIFASARW", "url": SITE_URL }
    });

    // Inkuru ziva ku yindi mbuga (crawl) zifite incamake gusa: tanga link y'isoko ngo umusomyi asome yose
    const srcBtn = $("sourceButton"), srcLink = String(currentStory.link || currentStory.url || "");
    if (srcBtn) {
        const isExt = /^https?:\/\//i.test(srcLink) && !srcLink.startsWith(SITE_URL);
        if (isExt) { srcBtn.href = srcLink; srcBtn.textContent = `📰 ${labels.source}` + (currentStory.source ? ` (${String(currentStory.source).replace(/ YouTube$/i, "")})` : ""); srcBtn.style.display = ""; }
        else srcBtn.style.display = "none";
    }

    // Mbaza MIFASA AI kuri iyi nkuru
    const ask = $("askAIButton");
    ask.textContent = `🤖 ${labels.ask}`;
    ask.href = `index.html?q=${encodeURIComponent(title)}`;

    const shareEl = $("storyShare");
    // Gusangiza: ahora hose dukoresha s/<id>.html (ifite title, ishusho n'ibindi byose byanditse muri HTML, WhatsApp/Facebook/X birabisoma).
    // story.html?news=ID ntibishoboka ko bots zisoma (zidakoresha JS), bityo ntiyifashishwa mu gusangiza.
    const renderShare = (base) => {
        const storyUrl = base + (base.includes("?") ? "&" : "?") + "lang=" + currentLang;
        window.__shareUrl = storyUrl;
        shareEl.innerHTML = `
        <span>${esc(labels.share)}</span>
        <a href="https://wa.me/?text=${encodeURIComponent(title + " " + storyUrl)}" target="_blank" rel="noopener">WhatsApp</a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(storyUrl)}" target="_blank" rel="noopener">Facebook</a>
        <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(storyUrl)}" target="_blank" rel="noopener">X</a>
    `;
    };
    window.__renderShare = renderShare;
    renderShare(staticUrl || window.location.href.split("#")[0]);

    $("loadingText").style.display = "none";
    $("contentWrapper").style.display = "block";
    renderRelated();
}

/* Inkuru zifitanye isano: MIFASA AI (script.js) ipakururwa nyuma y'uko inkuru igaragara, ntitinza gusoma */
function ensureEngine(cb) {
    if (window.MifasaAI) { cb(); return; }
    window.MIFASA_API_ONLY = true;                 // injini ntikora ku miterere y'uru rupapuro
    const s = document.createElement("script");
    s.src = "script.js";
    s.async = true;
    s.onload = cb;
    s.onerror = () => {};
    document.head.appendChild(s);
}

function loadRelated() {
    if (!currentStory) return;
    const title = currentStory.title_rw || currentStory.title_en || currentStory.title || currentStory.name || "";
    if (!title) return;
    const me = (getQueryParam("news") || getQueryParam("id") || "").toLowerCase();
    const mySlug = generateSlug(title);

    const start = () => ensureEngine(() => {
        if (!window.MifasaAI) return;
        window.MifasaAI.whenReady(() => {
            relatedItems = window.MifasaAI.search(title, 12)
                .filter(a => String(a.share_id).toLowerCase() !== me && generateSlug(a.title_rw || a.title_en || "") !== mySlug)
                .slice(0, 4);
            renderRelated();
        }, 15000);
    });
    if ("requestIdleCallback" in window) requestIdleCallback(start, { timeout: 2500 });
    else setTimeout(start, 1200);
}

function renderRelated() {
    const box = $("relatedBox");
    if (!box) return;
    if (!relatedItems.length) { box.style.display = "none"; return; }
    box.innerHTML = `<h3>${esc(uiLabels[currentLang].related)}</h3><div class="related-grid">` +
        relatedItems.map(a => {
            const t = currentLang === "en" ? (a.title_en || a.title_rw) : (a.title_rw || a.title_en);
            const href = `story.html?news=${encodeURIComponent(a.share_id || a.id || "")}&cat=${encodeURIComponent(a.category || a.source || "")}&lang=${currentLang}`;
            return `<a class="related-card" href="${esc(/^(https?:)?\/\//i.test(a.link || "") ? href : (a.link || href))}">` +
                `<img src="${esc(a.thumbnail || a.image)}" alt="" loading="lazy" onerror="this.style.display='none'">` +
                `<span>${esc(t)}</span></a>`;
        }).join("") + `</div>`;
    box.style.display = "block";
}

function showError(msg) {
    const container = $("mainContainer");
    container.innerHTML = `<div class="error-box"><h2>${esc(msg)}</h2><p><a href="index.html" style="color:var(--primary);font-weight:700;text-decoration:none;">${esc(uiLabels[currentLang].home)}</a></p></div>`;
}

/* Ibara + umwijima */
function applyTheme(theme, dark) {
    document.body.className = [dark ? "dark-mode" : "", theme && theme !== "mifasastyle" ? theme : ""].filter(Boolean).join(" ");
}
function setDarkLabel(dark) {
    const btn = $("darkModeToggle");
    if (btn) btn.textContent = dark ? "☀ Umucyo" : "🌙 Umwijima";
}

/* Event Listeners */
function init() {
    // Dark Mode + Theme: bikurikira ibyo umuntu yahisemo ku zindi paji
    const dk = getPref("darkmode");
    const isDark = dk ? dk === "on" : localStorage.getItem("darkMode") === "true";
    const savedTheme = getPref("theme") || "mifasastyle";
    applyTheme(savedTheme, isDark);
    setDarkLabel(isDark);

    const themeSel = $("themeSelect");
    if (themeSel) themeSel.value = savedTheme;
    const langSel = $("langSelect");
    if (langSel) langSel.value = currentLang;

    $("darkModeToggle")?.addEventListener("click", () => {
        const dark = document.body.classList.toggle("dark-mode");
        setPref("darkmode", dark ? "on" : "off");
        localStorage.setItem("darkMode", dark);
        setDarkLabel(dark);
    });

    // Theme Selector
    themeSel?.addEventListener("change", (e) => {
        setPref("theme", e.target.value);
        applyTheme(e.target.value, document.body.classList.contains("dark-mode"));
    });

    // Language Selector
    langSel?.addEventListener("change", (e) => {
        currentLang = e.target.value;
        localStorage.setItem("siteLang", currentLang);
        setPref("lang", currentLang);
        updateUI();
    });

    // Audio Speech Synthesis
    $("audioButton")?.addEventListener("click", () => {
        if (!('speechSynthesis' in window)) return;
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            $("audioButton").textContent = `🔊 ${uiLabels[currentLang].listen}`;
            return;
        }

        const title = $("storyTitle").textContent;
        const text = $("fullContent").textContent;
        const utterance = new SpeechSynthesisUtterance(`${title}. ${text}`);
        utterance.lang = currentLang === "en" ? "en-US" : "rw-RW";

        utterance.onend = () => $("audioButton").textContent = `🔊 ${uiLabels[currentLang].listen}`;
        window.speechSynthesis.speak(utterance);
        $("audioButton").textContent = `⏹ ${uiLabels[currentLang].stop}`;
    });

    // Copy Link
    $("copyLinkButton")?.addEventListener("click", async function() {
        try {
            await navigator.clipboard.writeText(window.__shareUrl || window.location.href);
            const orig = this.textContent;
            this.textContent = uiLabels[currentLang].copied;
            setTimeout(() => { this.textContent = orig; }, 2000);
        } catch(e) {}
    });

    loadStory();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
})();
</script>

    document.head.appendChild(l);
  } catch (e) {}
});
