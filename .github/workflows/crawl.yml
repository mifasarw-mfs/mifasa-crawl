name: mifasa-crawl
on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node crawl.js
      - name: Keep the new file in the repo
        run: |
          git config user.name "mifasa-crawler"; git config user.email "actions@users.noreply.github.com"
          git add crawl-news.json; git commit -m "crawl: update news" || echo "no change"; git push || true
      - name: Upload to Neocities
        env: { NEOCITIES_API_KEY: "${{ secrets.NEOCITIES_API_KEY }}" }
        run: curl -fsS -H "Authorization: Bearer $NEOCITIES_API_KEY" -F "crawl-news.json=@crawl-news.json" https://neocities.org/api/upload
