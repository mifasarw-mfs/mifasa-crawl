# MIFASA crawler on GitHub (free).
#   every 5 minutes : RSS/Atom sources (news that changes fast)          -> node crawl.js --mode=fast
#   every hour (:07) : sites WITHOUT RSS + Wikipedia knowledge topics     -> node crawl.js --mode=slow  +  node crawl-knowledge.js
#   when you edit crawl-feeds.json / crawl-topics.json / the crawlers     -> everything at once
# NEW: node crawl-videos.js gets EVERY video of every YouTube channel (hourly) -> videos/<channel>.json (first run = all, later = only new).
# NEW: node make-story-pages.js makes s/<share_id>.html for every story (real og:/twitter: tags inside the HTML, so shared links look right).
# Uploads to Neocities ONLY when something changed. Needs the secret NEOCITIES_API_KEY.
# NEW: every story is also kept FOREVER in news-archive/YYYY-MM-DD.json (+ index.json), each with a permanent id (share_id "MN202611_...").
#      crawl-news.json stays the fast 60-day window; the archive never loses anything.
# NEW (HUB): the FULL text of every story is kept in news-full/YYYY-MM-DD.json, and stories ONLY (no videos) are uploaded to
#      https://mizeromifasa.neocities.org/ with the secret NEOCITIES_API_KEY_HUB (node upload-hub.js). Videos are never archived.
name: mifasa-crawl
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    paths: ["crawl-feeds.json", "crawl-topics.json", "crawl.js", "crawl-knowledge.js", "crawl-videos.js", "notify-post.js", "make-sitemap.js", "make-story-pages.js", "make-feed.js", "upload-neocities.js", "upload-hub.js", "404.html", ".github/workflows/crawl.yml"]
permissions:
  contents: write
concurrency:
  group: mifasa-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Choose what to crawl
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "7 * * * *" ]; then echo "mode=slow" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ]; then echo "mode=fast" >> "$GITHUB_OUTPUT"
          else echo "mode=all" >> "$GITHUB_OUTPUT"; fi
      - name: Crawl news
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node crawl.js --mode=${{ steps.mode.outputs.mode }}
      - name: Update Wikipedia knowledge
        if: steps.mode.outputs.mode != 'fast'
        run: node crawl-knowledge.js
      - name: Get ALL videos of every YouTube channel
        if: steps.mode.outputs.mode != 'fast'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node crawl-videos.js
      - name: Make one static HTML page per story (s/<share_id>.html, real meta tags for WhatsApp/Facebook/Google)
        continue-on-error: true
        run: node make-story-pages.js
      - name: Make sitemap.xml (one URL per story)
        continue-on-error: true
        run: node make-sitemap.js
      - name: Make feed.xml (RSS, newest 60 stories)
        continue-on-error: true
        run: node make-feed.js
      - name: Keep the new files in the repo
        id: keep
        run: |
          git config user.name "mifasa-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add crawl-news.json crawl-words.json crawl-knowledge.json
          git add sitemap.xml feed.xml 2>/dev/null || true
          git add news-archive 2>/dev/null || true
          git add news-full 2>/dev/null || true
          git add s 2>/dev/null || true
          git add videos 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new."
          else
            git commit -m "crawl: update"
            for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Neocities (compares with what is REALLY on Neocities, so a missed file is always sent next run)
        if: steps.keep.outputs.changed == 'true' || github.event_name != 'schedule' || github.event.schedule == '7 * * * *'
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: node upload-neocities.js
      - name: Upload STORIES ONLY (no videos) to the HUB mizeromifasa.neocities.org
        if: steps.keep.outputs.changed == 'true' || github.event_name != 'schedule' || github.event.schedule == '7 * * * *'
        continue-on-error: true
        env:
          NEOCITIES_API_KEY_HUB: ${{ secrets.NEOCITIES_API_KEY_HUB }}
        run: node upload-hub.js
      - name: Tell people about new videos + stories (web push + Discord) - AFTER the upload, so the link already works
        continue-on-error: true
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SEGMENT: ${{ vars.ONESIGNAL_SEGMENT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node notify-post.js
      - name: Remember what was already announced
        if: always()
        continue-on-error: true
        run: |
          git config user.name "mifasa-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add notify-sent.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "notify: state"
            for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
          fi
