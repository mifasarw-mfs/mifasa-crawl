# MIFASARW Android v2: debug APK (default) or SIGNED release APK + AAB (Google Play).
# Run: GitHub -> Actions -> "mifasa-android" -> Run workflow (tick "release" for the signed build).
# Release needs 4 repo secrets (Settings -> Secrets -> Actions): KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
#   Make the keystore ONCE (keep it forever, updates must use the same one):
#   keytool -genkeypair -v -keystore mifasa.jks -alias mifasa -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 mifasa.jks   <- paste the output into KEYSTORE_BASE64
# The app loads https://mifasarw.neocities.org (site updates reach the app at once) + native plugins:
# daily local notifications, native share, status bar colour, versionCode = run number, local "no internet" page.
name: mifasa-android
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Signed release APK + AAB (needs keystore secrets)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  SITE_URL: https://mifasarw.neocities.org
  APP_ID: rw.mifasarw.app
  APP_NAME: MIFASARW
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor project (pinned to v7 = works with Java 21)
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/share@7 @capacitor/status-bar@7 @capacitor/assets@3 >/dev/null
          mkdir www
          cat > www/index.html <<HTML
          <!doctype html><title>MIFASARW</title><meta http-equiv="refresh" content="0;url=$SITE_URL">
          HTML
          cat > www/error.html <<HTML
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIFASARW</title>
          <style>body{font-family:system-ui;text-align:center;padding:14vh 24px;background:#fff;color:#1a1a1f}h1{color:#e63946}button{background:#e63946;color:#fff;border:0;border-radius:12px;padding:14px 22px;font:700 1rem system-ui}</style></head>
          <body><h1>📴 MIFASARW</h1><p>Nta internet. Fungura internet hanyuma ukande hasi.<br>No internet. Connect and tap below.</p>
          <button onclick="location.href='$SITE_URL'">Ongera ugerageze / Retry</button></body></html>
          HTML
          node -e '
          const c={appId:process.env.APP_ID,appName:process.env.APP_NAME,webDir:"www",backgroundColor:"#ffffff",
            server:{url:process.env.SITE_URL,androidScheme:"https",errorPath:"error.html",
              allowNavigation:["mifasarw.neocities.org","*.youtube.com","*.youtube-nocookie.com","*.ytimg.com","api.open-meteo.com","open.er-api.com","*.onesignal.com"]},
            plugins:{LocalNotifications:{iconColor:"#e63946"},StatusBar:{backgroundColor:"#e63946",style:"LIGHT"}}};
          require("fs").writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));'
          npx cap add android
          cd android/app
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' src/main/AndroidManifest.xml
      - name: App icon (icon-512.png from the repo)
        run: |
          cd app
          if [ -f ../icon-512.png ]; then mkdir -p assets && cp ../icon-512.png assets/icon-only.png && cp ../icon-512.png assets/icon-foreground.png; npx capacitor-assets generate --android --iconBackgroundColor '#e63946' --iconBackgroundColorDark '#e63946' || true; fi
          # fix: capacitor-assets makes ic_launcher.xml point to @mipmap/ic_launcher_background (missing) -> use a colour instead
          R=android/app/src/main/res
          mkdir -p $R/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#e63946</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' $R/mipmap-anydpi-v26/*.xml 2>/dev/null || true
      - name: Build type
        id: kind
        env: { KS: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: |
          if [ "${{ inputs.release }}" = "true" ] && [ -n "$KS" ]; then echo "release=true" >> "$GITHUB_OUTPUT"
          else echo "release=false" >> "$GITHUB_OUTPUT"; [ "${{ inputs.release }}" = "true" ] && echo "::warning::Keystore secrets missing: building DEBUG APK instead"; fi; true
      - name: Build debug APK
        if: steps.kind.outputs.release != 'true'
        run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk ../../MIFASARW.apk
      - name: Build + sign release (APK and AAB)
        if: steps.kind.outputs.release == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd app/android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out ../../MIFASARW.apk "$RUNNER_TEMP/aligned.apk"
          cp app/build/outputs/bundle/release/app-release.aab ../../MIFASARW.aab
          jarsigner -keystore "$RUNNER_TEMP/ks.jks" -storepass:env KS_PASS -keypass:env KEY_PASS ../../MIFASARW.aab "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/ks.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: MIFASARW-android
          path: |
            app/MIFASARW.apk
            app/MIFASARW.aab
          if-no-files-found: ignore
      - name: Publish to GitHub Releases (public APK link for install.html)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd app
          FILES="MIFASARW.apk"; [ -f MIFASARW.aab ] && FILES="$FILES MIFASARW.aab"
          gh release delete apk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest $FILES --repo "$GITHUB_REPOSITORY" --title "MIFASARW Android (latest)" --notes "Build #${{ github.run_number }}" --latest=false
          gh release create "build-${{ github.run_number }}" $FILES --repo "$GITHUB_REPOSITORY" --title "MIFASARW build ${{ github.run_number }}" --notes "Archived build" --latest=false
