# Runs crawl.js and uploads crawl-news.json + crawl-words.json + crawl-status.json to Neocities.
# Needs the secret NEOCITIES_API_KEY (Settings > Secrets and variables > Actions).
# Cron: "*/30 * * * *" = every 30 min (OK for a PRIVATE repo). Use "*/5 * * * *" ONLY if the repo is PUBLIC.
name: mifasa-crawl
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mifasa-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node crawl.js
      - name: Keep the new files in the repo
        run: |
          git config user.name "mifasa-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add -A crawl-news.json crawl-words.json crawl-status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "crawl: update news"
            git pull --rebase -q || true
            git push || echo "::warning::push failed"
          fi
      - name: Upload to Neocities when the LIVE site differs
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          need=false
          for f in crawl-news.json crawl-words.json; do
            [ -f "$f" ] || continue
            curl -fsS "https://mifasarw.neocities.org/$f?t=$(date +%s)" -o "live-$f" || : > "live-$f"
            cmp -s "$f" "live-$f" || need=true
          done
          if [ "$need" = true ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args=()
            for f in crawl-news.json crawl-words.json crawl-status.json; do [ -f "$f" ] && args+=(-F "$f=@$f"); done
            curl -fsS -H "Authorization: Bearer $NEOCITIES_API_KEY" "${args[@]}" https://neocities.org/api/upload
          else
            echo "Live site already up to date."
          fi
